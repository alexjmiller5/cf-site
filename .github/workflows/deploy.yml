name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: op://personal-infra/cloudflare/api-token
          CLOUDFLARE_ACCOUNT_ID: op://personal-infra/cloudflare/account-id
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bunx wrangler deploy
        # Worker secrets are pushed from the laptop via `just sync-secrets`;
        # CI only tests, builds, and deploys code.
